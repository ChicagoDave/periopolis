<title>Future City Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: an engineer's calc sheet. A title block, then one ruled ledger with a column per city.
   Premises are fill-in fields; consequences are plain figures; the answers carry a double underline. */
:root {
  --paper: #ECF0EA; --sheet: #F8FAF6; --ink: #17211C; --ink-2: #4D5C53;
  --rule: #C3CEC5; --rule-2: #DCE3DC; --field: #FFFFFF;
  --sign: #0B6B49; --sign-ink: #FFFFFF; --new: #0B6B49;
  --flag: #8F5600; --flag-bg: #FBF1DC; --bad: #B3261E;
  --display: "Overpass", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --data: "Overpass Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1512; --sheet: #161E1A; --ink: #E4EBE5; --ink-2: #9CAEA2;
    --rule: #2F3E35; --rule-2: #222D27; --field: #0A0F0D;
    --sign: #0E7A54; --sign-ink: #FFFFFF; --new: #5CCBA0;
    --flag: #E5AE45; --flag-bg: #2B2414; --bad: #FF8A80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1512; --sheet: #161E1A; --ink: #E4EBE5; --ink-2: #9CAEA2;
  --rule: #2F3E35; --rule-2: #222D27; --field: #0A0F0D;
  --sign: #0E7A54; --sign-ink: #FFFFFF; --new: #5CCBA0;
  --flag: #E5AE45; --flag-bg: #2B2414; --bad: #FF8A80; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.page { max-width: 1120px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 24px 72px; display: flex; flex-direction: column; gap: 28px; }
a { color: var(--new); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--new); outline-offset: 2px; }

/* title block */
.sign { background: var(--sign); color: var(--sign-ink); border-radius: 12px; padding: 6px; }
.sign-inner { border: 2px solid var(--sign-ink); border-radius: 7px; padding: 18px 22px 20px; }
.sign h1 { font: 800 clamp(1.9rem, 6vw, 3rem)/1.05 var(--display); margin: 0; text-wrap: balance; }
.sign p { font: 400 1.05rem/1.4 var(--display); margin: 10px 0 0; max-width: 60ch; }
.block { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--rule); background: var(--sheet); margin: 0; }
.block div { padding: 8px 12px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin: 0 -1px -1px 0; min-width: 0; }
.block dt { font: 600 .68rem var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.block dd { font: 400 .9rem var(--data); margin: 2px 0 0; overflow-wrap: anywhere; }
.prose { max-width: 66ch; display: flex; flex-direction: column; gap: 12px; }
.prose p { margin: 0; }
h2 { font: 800 1.35rem/1.2 var(--display); margin: 0; text-wrap: balance; }
.lede { font-size: .95rem; color: var(--ink-2); max-width: 66ch; margin: 6px 0 0; }
section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* provenance tags */
.tag { display: inline-block; font: 600 .66rem/1.5 var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 0 6px; border: 1px solid var(--rule); border-radius: 3px; color: var(--ink-2); white-space: nowrap; margin-right: 6px; vertical-align: 1px; }
.tag.assumed { color: var(--flag); border-color: var(--flag); background: var(--flag-bg); }
.tag.yours { color: var(--new); border-color: var(--new); }
.tag.derived { border-style: dashed; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: .9rem; color: var(--ink-2); list-style: none; padding: 0; margin: 0; }

/* the ledger */
.ledger { border-top: 2px solid var(--ink); }
.cols, .row { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 2.1fr); column-gap: 18px; }
.cols { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--paper); border-bottom: 2px solid var(--ink); padding: 8px 0 6px; font: 800 .78rem var(--display); letter-spacing: .09em; text-transform: uppercase; }
.cols span:nth-child(2), .cols span:nth-child(3) { text-align: right; }
.cols span:nth-child(3) { color: var(--new); }
.sec { padding: 26px 0 8px; border-bottom: 1px solid var(--ink-2); }
.sec h3 { font: 800 1.1rem/1.2 var(--display); margin: 0; }
.sec h3 b { font: 600 .9rem var(--data); color: var(--ink-2); margin-right: 10px; }
.sec p { margin: 4px 0 0; font-size: .9rem; color: var(--ink-2); max-width: 70ch; }
.row { padding: 9px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.row.given { background: var(--sheet); box-shadow: -8px 0 0 var(--sheet), 8px 0 0 var(--sheet); }
.label { font: 600 .95rem/1.3 var(--display); min-width: 0; }
.val { font: 400 .98rem/1.3 var(--data); font-variant-numeric: tabular-nums; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.val.both { grid-column: span 2; text-align: center; }
.val.text { font: 400 .92rem/1.3 var(--display); }
.val input, td input[type="number"] { font: inherit; width: 8.5ch; max-width: 100%; text-align: right; background: var(--field); color: var(--ink); border: 0; border-bottom: 2px solid var(--ink-2); border-radius: 2px 2px 0 0; padding: 2px 4px; }
.val input.assumed, td input.assumed { border-bottom: 2px dashed var(--flag); }
.val input[aria-invalid="true"], td input[aria-invalid="true"] { border-bottom-color: var(--bad); color: var(--bad); }
.unit { color: var(--ink-2); font-size: .82em; margin-left: .3em; }
.alt { display: block; font-size: .76rem; color: var(--ink-2); margin-top: 2px; }
.key .num { font-weight: 600; border-bottom: 3px double currentColor; padding-bottom: 1px; }
.note { font-size: .86rem; line-height: 1.45; color: var(--ink-2); min-width: 0; display: flex; flex-direction: column; gap: 5px; }
@media (max-width: 780px) {
  .cols, .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 14px; row-gap: 6px; }
  .cols span:nth-child(1), .cols span:nth-child(4) { display: none; }
  .label, .note { grid-column: 1 / -1; }
}

/* summary and side tables */
.sum { border-top: 2px solid var(--ink); }
.sum .row { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1fr); }
.sum .val { font-size: 1.25rem; }
.sum .head { font: 800 .78rem var(--display); letter-spacing: .09em; text-transform: uppercase; border-bottom: 2px solid var(--ink); padding: 8px 0 6px; }
.sum .head span:nth-child(n+2) { text-align: right; }
.sum .head span:nth-child(3) { color: var(--new); }
@media (max-width: 780px) { .sum .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .sum .head span:first-child { display: none; } }
.scroll { overflow-x: auto; border-top: 2px solid var(--ink); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 12px 7px 0; border-bottom: 1px solid var(--rule); text-align: right; vertical-align: baseline; white-space: nowrap; }
thead th { font: 800 .72rem/1.3 var(--display); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); white-space: normal; min-width: 5.5rem; }
td { font: 400 .92rem var(--data); }
thead th:first-child { text-align: left; }
tbody th { text-align: left; font: 600 .92rem/1.3 var(--display); color: var(--ink); white-space: normal; min-width: 9rem; }
td.wrap, th.wrap { white-space: normal; text-align: left; font: 400 .86rem/1.4 var(--body); color: var(--ink-2); min-width: 15rem; }
thead th.wrap { font: 800 .72rem/1.3 var(--display); }
tr.grp th { text-align: left; color: var(--ink); border-bottom: 1px solid var(--ink-2); }
tr.grp th.newc { color: var(--new); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { font: 600 .9rem var(--display); color: var(--ink); background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 4px; padding: 7px 14px; cursor: pointer; }
.btn:hover { background: var(--ink); color: var(--paper); }
.said { font: 400 .85rem var(--display); color: var(--ink-2); }
#dump { width: 100%; min-height: 12rem; font: 400 .8rem/1.4 var(--data); background: var(--field); color: var(--ink); border: 1px solid var(--rule); padding: 8px; }
.list { margin: 0; padding-left: 1.2rem; max-width: 70ch; display: flex; flex-direction: column; gap: 6px; }
.spec { margin: 0; padding-left: 2rem; max-width: 72ch; display: flex; flex-direction: column; gap: 7px; }
.spec li::marker { font: 600 .9rem var(--data); color: var(--new); }
.spec li span { color: var(--ink-2); }
h3.minor { font: 800 1rem/1.2 var(--display); margin: 10px 0 0; }
/* tables that sit inside the ledger. They pass over the sticky column heading, which does not describe them. */
.inset { padding: 10px 0 14px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 8px; min-width: 0; position: relative; z-index: 3; background: var(--paper); }
.inset .scroll { border-top: 0; }
.inset td, .inset tbody th { vertical-align: top; padding-top: 9px; padding-bottom: 9px; }
tbody th small { display: block; font: 400 .78rem/1.35 var(--body); color: var(--ink-2); margin-top: 2px; }
select { font: 400 .85rem var(--display); background: var(--field); color: var(--ink); border: 1px solid var(--ink-2); border-radius: 3px; padding: 3px 4px; max-width: 100%; }
td.enough { white-space: normal; text-align: left; font: 400 .84rem/1.4 var(--display); min-width: 10.5rem; }
td .note { min-width: 15rem; }
.note.foot { max-width: 72ch; }
/* the needs table: a line of settings for each need, and where its number comes from on the line beneath */
table.needs th, table.needs td { border-bottom: 0; }
table.needs thead th { border-bottom: 1px solid var(--ink-2); min-width: 0; }
table.needs tbody th { border-bottom: 1px solid var(--rule); min-width: 10rem; max-width: 15rem; }
table.needs tr.set td { padding-bottom: 2px; }
table.needs tr.why td { padding-top: 2px; padding-bottom: 11px; border-bottom: 1px solid var(--rule); }
table.needs tr.why .note { max-width: 80ch; }
table.needs .l { text-align: left; }
#walk th { min-width: 0; }
#harm { max-width: 38rem; }
#scale thead th { min-width: 4.3rem; }
#scale tbody th, #scale thead tr:last-child th:first-child { position: sticky; left: 0; background: var(--paper); min-width: 6.5rem; }
/* on a phone a stacked table turns each row into a block, with the column heading above each value */
@media (max-width: 780px) {
  table.stack, table.stack tbody, table.stack tr, table.stack th, table.stack td { display: block; }
  table.stack thead { display: none; }
  table.stack tbody tr { padding: 10px 0; border-bottom: 1px solid var(--rule); }
  table.stack tbody th, table.stack tbody td { border-bottom: 0; padding: 3px 0; text-align: left; white-space: normal; min-width: 0; max-width: none; }
  table.stack tbody th { font-size: 1rem; }
  table.stack td[data-label]::before { content: attr(data-label); display: block; font: 600 .66rem/1.6 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
  table.stack td .note { min-width: 0; }
  table.needs.stack tr.set { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 14px; row-gap: 6px; border-bottom: 0; padding-bottom: 6px; }
  table.needs.stack tr.set th { grid-column: 1 / -1; }
  table.needs.stack tr.set td { padding: 0; }
  table.needs.stack tr.why { padding-top: 0; }
  table.needs.stack tr.why td { border-bottom: 0; padding: 0; }
}
.chip { display: inline-block; font: 600 .66rem/1.6 var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 0 7px; border-radius: 10px; border: 1px solid var(--rule); white-space: nowrap; }
.chip.ok { color: var(--new); border-color: var(--new); }
.chip.short { color: var(--flag); border-color: var(--flag); background: var(--flag-bg); }
.chip.tight { color: var(--flag); border-color: var(--flag); }
#stretch tbody th { min-width: 13rem; }
.sources { font-size: .88rem; color: var(--ink-2); }
</style>
